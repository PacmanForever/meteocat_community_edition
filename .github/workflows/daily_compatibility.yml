name: HA Daily Compatibility Check

on:
  schedule:
    - cron: '0 6 * * *'  # 6:00 AM UTC daily
  workflow_dispatch:      # Allow manual trigger

jobs:
  check-compatibility:
    name: Check against latest HA stable
    runs-on: ubuntu-latest
    outputs:
      tested_version: ${{ steps.home_assistant_version.outputs.version }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-test.txt

      - name: Install Home Assistant stable
        run: |
          echo "Installing latest stable Home Assistant..."
          pip install --upgrade homeassistant pytest-homeassistant-custom-component
          
          echo "Installed Home Assistant version:"
          pip show homeassistant | grep Version

      - name: Run Tests
        run: |
          pytest tests/
      - name: Capture tested Home Assistant version
        id: home_assistant_version
        run: echo "version=$(python -c 'from importlib.metadata import version; print(version("homeassistant"))')" >> "$GITHUB_OUTPUT"

  publish-tested-version:
    if: github.ref == 'refs/heads/main'
    needs: check-compatibility
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Update tested version badge data
        env:
          TESTED_VERSION: ${{ needs.check-compatibility.outputs.tested_version }}
        run: |
          python -c "import json, os; from pathlib import Path; Path('docs/home_assistant_compatibility.json').write_text(json.dumps({'tested_version': os.environ['TESTED_VERSION']}, indent=2) + '\\n')"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/home_assistant_compatibility.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: update tested Home Assistant version"
          git pull --rebase origin main
          git push origin main
